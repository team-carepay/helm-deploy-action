name: Helm Deploy
description: Updates YAML file in GitHub by updating a jsonpath entry with a new value
inputs:
  file:
    description: For example 'ken-test/applications/default/security/ussd/values.yaml'
    required: true
  value:
    description: For example `v1.2.3`
    required: true
  username:
    description: Git committer name
    required: true
    default: github-actions
  email:
    description: Git committer email
    required: true
    default: github-actions@users.noreply.github.com
  token:
    description: GitHub Personal Access Token (with repo contents write access)
    required: true
  jsonpath:
    required: true
    default: $.microservice.image
  workspace:
    description: GitHub owner/organisation (defaults to the current repository's owner)
    required: false
  repository:
    description: GitHub repository name (defaults to the current repository)
    required: false
runs:
  using: "node24"
  main: "dist/index.js"
